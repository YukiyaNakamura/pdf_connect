<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PDF結合・URL短縮</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="container">
      <div class="tabs" role="tablist" aria-label="機能の切り替え">
        <button id="tab-pdf" class="tab" type="button" role="tab" aria-selected="true" aria-controls="panel-pdf">PDF結合</button>
        <button id="tab-shorten" class="tab" type="button" role="tab" aria-selected="false" aria-controls="panel-shorten" tabindex="-1">URL短縮</button>
      </div>

      <!-- ========== PDF結合 ========== -->
      <div id="panel-pdf" class="panel" role="tabpanel" aria-labelledby="tab-pdf">
        <header>
          <h1>PDF結合</h1>
          <p class="lead">PDFを追加して順番を並べ替え、1つのファイルにまとめます。ファイルはブラウザ内だけで処理され、外部に送信されません。</p>
        </header>

        <section aria-labelledby="add-heading">
          <h2 id="add-heading" class="visually-hidden">PDFを追加</h2>
          <div id="dropzone" class="dropzone">
            <p class="dropzone-text">ここにPDFをドラッグ＆ドロップ</p>
            <p class="dropzone-or">または</p>
            <label class="button button-secondary">
              ファイルを選択
              <input id="file-input" type="file" accept="application/pdf,.pdf" multiple class="visually-hidden" />
            </label>
          </div>
        </section>

        <section aria-labelledby="list-heading">
          <div class="list-header">
            <h2 id="list-heading">ファイル一覧 <span id="count" class="count"></span></h2>
            <button id="clear" type="button" class="button-link" hidden>すべて削除</button>
          </div>
          <p id="empty" class="empty">まだPDFが追加されていません</p>
          <ol id="file-list" class="file-list"></ol>
        </section>

        <section aria-labelledby="merge-heading" class="card">
          <h2 id="merge-heading" class="visually-hidden">結合してダウンロード</h2>
          <label for="filename" class="field-label">保存するファイル名</label>
          <div class="filename-row">
            <input id="filename" class="text-input" type="text" value="merged" autocomplete="off" spellcheck="false" />
            <span class="ext">.pdf</span>
          </div>
          <div id="message" class="message" role="alert" hidden></div>
          <button id="merge" type="button" class="button button-primary" disabled>結合してダウンロード</button>
        </section>
      </div>

      <!-- ========== URL短縮 ========== -->
      <div id="panel-shorten" class="panel" role="tabpanel" aria-labelledby="tab-shorten" hidden>
        <header>
          <h1>URL短縮</h1>
          <p class="lead">長いURLから短い共有リンクを作ります。短縮リンクを開くと、検索条件（?以降）やページ内の位置（#以降）も含めて元のURLに移動します。</p>
        </header>

        <form id="shorten-form" class="card" novalidate>
          <label for="long-url" class="field-label">短縮するURL</label>
          <input id="long-url" class="text-input" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false"
                 placeholder="https://example.com/page?q=1#section" aria-describedby="shorten-error" />
          <div id="shorten-error" class="message" role="alert" hidden></div>
          <button id="shorten-btn" type="submit" class="button button-primary">短縮する</button>
        </form>

        <section id="shorten-result" class="card" aria-labelledby="result-heading" hidden>
          <h2 id="result-heading" class="field-label">短縮リンク</h2>
          <div class="copy-row">
            <input id="short-url" class="text-input" type="text" readonly aria-labelledby="result-heading" />
            <button id="copy-btn" type="button" class="button button-secondary">コピー</button>
          </div>
          <p id="copy-status" class="copy-status" aria-live="polite"></p>
          <p class="original">元のURL：<a id="original-url" target="_blank" rel="noopener noreferrer"></a></p>
        </section>
      </div>

      <div id="live" class="visually-hidden" aria-live="polite"></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
